name: render-scenes
# Renders any 3D location defined in factory/scenes/rooms.py that has no stills yet, then commits them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["factory/scenes/**"]
permissions:
  contents: write
concurrency: { group: scenes, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { todo: "${{ steps.p.outputs.todo }}" }
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, os, json
          s = open("factory/scenes/rooms.py").read()
          todo = [x for x in re.findall(r'SCENE == "(\w+)"', s) if not os.path.exists(f"assets/stills/{x}/V_v.png")]
          print("todo=" + json.dumps(todo))
          PY
  render:
    needs: plan
    if: needs.plan.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: { scene: "${{ fromJson(needs.plan.outputs.todo) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install bpy==5.3.0 pillow numpy
      - run: THREADS=$(nproc) python factory/scenes/rooms.py ${{ matrix.scene }} && python factory/scenes/pack.py assets/stills/${{ matrix.scene }}
      - uses: actions/upload-artifact@v4
        with: { name: "scene-${{ matrix.scene }}", path: "assets/stills/${{ matrix.scene }}" }
  commit:
    needs: render
    if: always() && needs.render.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/scenes, pattern: "scene-*" }
      - run: |
          for d in /tmp/scenes/scene-*; do n=${d#/tmp/scenes/scene-}; mkdir -p assets/stills/$n; cp -r $d/* assets/stills/$n/; done
          git config user.name "rl-kerala-bot"; git config user.email "bot@users.noreply.github.com"
          git add assets/stills && git commit -m "Rendered new 3D locations" && git pull --rebase && git push || echo "nothing to commit"

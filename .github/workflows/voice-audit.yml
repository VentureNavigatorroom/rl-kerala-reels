name: voice-audit
# Pronunciation audit: speak real script lines, transcribe them with a Malayalam recogniser, report misheard words.
on:
  workflow_dispatch:
    inputs:
      lines: { description: "how many lines to test", default: "120" }
concurrency: { group: voice-audit, cancel-in-progress: true }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache voice model and voice lines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .voice_cache
          key: voice-audit-${{ github.run_id }}
          restore-keys: voice-
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "git+https://github.com/huggingface/parler-tts.git" soundfile pillow numpy
          pip install -q --force-reinstall --no-deps torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U protobuf sentencepiece librosa
      - name: Audit
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", AUDIT_LINES: "${{ inputs.lines }}", TTS_THREADS: "4" }
        run: python factory/voice_audit.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: voice-audit, path: audit }

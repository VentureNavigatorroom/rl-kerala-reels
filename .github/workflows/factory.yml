name: reel-factory
# Builds new reels twice a day (one run makes ~60 reels). Built stock is capped at 220 reels because GitHub Pages
# sites are limited to about 1 GB (~2.5 MB per reel); the rest of the two-week backup waits as scripts in bank/.
on:
  schedule: [{ cron: "30 19 * * *" }, { cron: "30 7 * * *" }]   # 01:00 and 13:00 IST
  workflow_dispatch:
    inputs:
      stock_target: { description: "reels to keep ready", default: "220" }
      time_budget_min: { description: "minutes of building", default: "320" }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: factory, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Restore library (kept on its own branch, history squashed so the repo never grows)
        # the folder must exist before checkout (git refuses a missing work tree); a failed restore now stops the run
        # instead of silently starting from an empty library and rebuilding everything
        run: |
          mkdir -p library
          if git fetch -q origin library:library; then
            git --work-tree=library checkout library -- .
            git reset -q
            test -f library/manifest.json || { echo "::error::library branch restored but has no manifest.json"; exit 1; }
            echo "restored library: $(ls library/media | wc -l) media files, $(python3 -c 'import json;m=json.load(open("library/manifest.json"));print(len(m.get("items",[])),"reels")')"
          else
            echo "::warning::no library branch yet, starting empty"
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache voice model and voice lines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .voice_cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "git+https://github.com/huggingface/parler-tts.git" soundfile pillow numpy
          pip install -q --force-reinstall --no-deps torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U protobuf sentencepiece
          python -c "import torch, torchaudio, parler_tts; print(torch.__version__, torchaudio.__version__)"
      - name: Check bank (problems are listed here; the builder also skips any script that would render wrong)
        id: bankcheck
        continue-on-error: true
        run: python factory/check_bank.py
      - name: Build reels
        id: build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POSTED_URL: https://rl-kerala-autopilot.venturenavigatorworkshop.workers.dev/public/posted
          STOCK_TARGET: ${{ inputs.stock_target || '220' }}
          CAROUSEL_TARGET: "140"
          POSTER_TARGET: "70"
          STORY_TARGET: "105"
          TIME_BUDGET_MIN: ${{ inputs.time_budget_min || '320' }}
          TTS_THREADS: "4"
        run: python factory/build.py
      - name: Save library (single squashed commit on branch "library")
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}   # keep what was built even if a later reel crashed
        run: |
          cd library && git init -q -b library && git config user.name "reel-factory" && git config user.email "reel-factory@users.noreply.github.com"
          git add -A && git commit -q -m "library $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" library:library
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}   # keep what was built even if a later reel crashed
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}   # keep what was built even if a later reel crashed
        with: { path: library }
      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
      - name: Fail the run if the bank check found problems (after building and publishing, so nothing is lost)
        if: ${{ !cancelled() && steps.bankcheck.outcome == 'failure' }}
        run: echo "::error::check_bank.py found problems in bank/ (see the Check bank step)"; exit 1
